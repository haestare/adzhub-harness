# Publica a demo no GitHub Pages a cada push na main.
#
# Por que existe, se ja ha Railway: o Railway parou de redeployar sozinho e a
# demo ficou servindo uma versao antiga sem avisar. Este caminho nao tem watch
# path para configurar errado nem build para falhar em silencio: o Action roda
# no push, e o log do proprio GitHub diz se subiu.
#
# A demo e 100% estatica (o server.js so existe para hosts que rodam processo),
# entao o Pages serve ela inteira. O carimbo de cache-busting, que no Railway e
# feito pelo servidor, aqui e feito em build time por .github/carimbar.mjs.
#
# 🔴 ARMADILHA MEDIDA (2026-08-18): `actions/configure-pages` com
# `enablement: true` NAO consegue ligar o Pages sozinho. Ele chama
# POST /repos/{owner}/{repo}/pages, que exige permissao de ADMIN no
# repositorio, e o GITHUB_TOKEN do workflow nao tem isso por mais que o
# `permissions:` declare `pages: write`. O erro e "Resource not accessible by
# integration", que parece permissao mal declarada e nao e. Ligar o Pages e
# clique humano: Settings > Pages > Source: GitHub Actions, uma vez so.
# Por isso o primeiro passo CONFERE em vez de tentar: sem Pages ligado o job
# termina VERDE avisando o que fazer, em vez de encher a caixa de e-mail com
# falha vermelha a cada commit.
name: Publicar demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite disparar na mao pelo botao Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: O Pages esta ligado neste repositorio?
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$codigo" = "200" ]; then
            echo "ligado=sim" >> "$GITHUB_OUTPUT"
            echo "Pages ligado, publicando."
          else
            echo "ligado=nao" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages desligado::HTTP $codigo em /pages. Ligue em Settings > Pages > Source: GitHub Actions. O proximo push publica sozinho; nenhuma mudanca de codigo e necessaria."
          fi

      - name: Carimbar assets (cache-busting + build visivel na tela)
        if: steps.check.outputs.ligado == 'sim'
        run: node .github/carimbar.mjs

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.ligado == 'sim'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.ligado == 'sim'
        with:
          path: web           # so a demo vai para o ar, nao o paper nem os scripts

      - id: deploy
        if: steps.check.outputs.ligado == 'sim'
        uses: actions/deploy-pages@v4
